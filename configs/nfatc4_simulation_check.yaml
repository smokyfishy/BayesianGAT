# Explicit opt-in: can ESM features recover the SIMULATED ranges in unseen sequence blocks?
# This is a sanity check of the simulation, NOT a biological evaluation.
mode: corrected
data:
  pdb: nfatc4/AF-Q14934-F1-model_v4.pdb
  esm: nfatc4/Q14934_esm.npy
  mutation_vector: nfatc4/simulated_dmd_mutation_vector.npy
labels: {path: null, allow_simulated_target: true}
n_blocks: 6
model: {hidden_dim: 256, dropout: 0.3, heads: 4}
training: {epochs: 60, lr: 0.001, weight_decay: 0.00001}
mc_samples: 30
