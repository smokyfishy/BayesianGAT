# Corrected residue protocol: ESM-only inputs, leave-one-contiguous-block-out,
# inductive edges. Without external labels the run reports NOT EVALUATED.
mode: corrected
data:
  pdb: nfatc4/AF-Q14934-F1-model_v4.pdb
  esm: nfatc4/Q14934_esm.npy
  mutation_vector: nfatc4/simulated_dmd_mutation_vector.npy
labels:
  path: null                     # TSV: uniprot_pos (1-based), label (0/1), source (provenance)
  allow_simulated_target: false  # true -> clearly-labelled simulated-target recovery check
n_blocks: 6
model: {hidden_dim: 256, dropout: 0.3, heads: 4}
training: {epochs: 60, lr: 0.001, weight_decay: 0.00001}
mc_samples: 30
